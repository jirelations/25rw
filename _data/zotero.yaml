- id: tavarezLanguageRitualColonialism2024
  abstract: >-
    This chapter provides a condensed overview of the cultural and intellectual
    history of ritual language from classical antiquity to the nineteenth
    century, with a focus on how the regimentation of ritual speech became
    intertwined with colonial rule and Christian indoctrination between the
    sixteenth and the nineteenth centuries as part of the emergence of colonial
    dynamics of knowledge in the Americas and Asia. It focuses on a central
    property of ritual speech, defined here as inscriptibility, and on
    lexicographic hegemony and lexical invention as two important processes that
    structured colonial understandings of ritual language.

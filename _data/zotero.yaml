- id: schilbrackConceptReligion2022
  abstract: >-
    It is common today to take the concept religion as a taxonfor sets of social
    practices, a category-concept whose paradigmaticexamples are the so-called
    “world” religions of Judaism,Christianity, Islam, Hinduism, Buddhism,
    Confucianism, and Daoism.[1] Perhaps equally paradigmatic, though somewhat
    trickier to label, areforms of life that have not been given a name, either
    by practitionersor by observers, but are common to a geographical area or a
    group ofpeople—for example, the religion of China or that of ancientRome,
    the religion of the Yoruba or that of the Cherokee. In short,the concept is
    today used for a genus of social formations thatincludes several members, a
    type of which there are many tokens.

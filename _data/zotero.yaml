- id: tavarezAnthropologyRitualLanguage2024
  abstract: >-
    This chapter examines classic and current anthropological and social science
    approaches to ritualized activities and ritual language. As an introduction
    to the topic, it surveys early anthropological proposals by Boas, Durkheim,
    and Malinowski. It then turns to the influential work of Turner, Tambiah,
    and Rappaport before introducing a concise survey of current debates and
    methods. It also includes a discussion of recent research on the five major
    topical areas that provide a structure for the chapters in this volume, and
    it also situates the handbook’s chapters within classic and emerging
    paradigms.

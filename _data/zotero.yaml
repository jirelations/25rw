- id: srowigRadikalisierungIndividuenUeberblick2018
  abstract: >-
    Warum radikalisieren sich Individuen? Dieser Report gibt einen
    systematischen Überblick über den Forschungsstand zu den Ursachen und Folgen
    der Radikalisierung von Individuen und beschreibt wie diese in
    Wechselwirkung und Interaktion mit anderen Personen, sozialen Gruppen sowie
    Organisationen oder Institutionen stattfinden. Die Aneignung extremistischer
    Denkmuster sowie die Zugehörigkeit zu einer extremistischen
    Gleichaltrigengruppe im Jugendalter helfen bei der Befriedigung allgemeiner
    Bedürfnisse wie Anerkennung und Gruppenzugehörigkeit, aber auch bei der
    Reduktion von Unsicherheiten und Identitätskonflikten. Ideologien bieten
    Individuen nachvollziehbare Deutungsmuster und individuelle
    Handlungsalternativen für spezifische Problemlagen an. Der Report leitet aus
    seinen Erkenntnissen Vorschläge für zukünftige präventive und therapeutische
    Maßnahmen ab

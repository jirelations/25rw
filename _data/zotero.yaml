- id: mazumdarSacredSpacePlace1993
  abstract: >-
    The aim of this paper is to provide an understanding of the
    interconnectedness between religion, identity and attachment to sacred
    spaces. This is done in three parts. First, we provide a general
    understanding of attachment to sacred spaces, settings and objects and
    create a typology of attachment to different sacred spaces, from macro to
    micro, from natural to human-made, based on a brief comparison of several
    religions. Second, focusing on one part of this typology (attachment to
    homes), we illustrate the creation, content and meaning of sacred space
    through a detailed analysis of the Hindu house. Third, we examine the
    emergence of place attachment and identity, the ways religion through ritual
    connects people to places, and how places as settings for sacred behavior
    and socialization connects people to religion. Finally, by including
    personal history and auto-ethnography we attempt to ‘personalize’
    environmental psychology.
